name: MCQ Web Scraper Workflow

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs automatically every Sunday at 00:00 UTC
  workflow_dispatch:      # Enables manual execution button in GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Execute Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mcqs.csv
          git commit -m "Automated update: MCQ dataset CSV" || echo "No changes detected to commit."
          git push
