name: MCQ Web Scraper Workflow

on:
  workflow_dispatch:      # Manual "Run workflow" button in the Actions tab — no auto/scheduled runs
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'mcq'
        type: choice
        options:
          - mcq
          - general
      url:
        description: 'Target URL (general mode only)'
        required: false
        default: ''
      prompt:
        description: 'What to extract (general mode only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Execute Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPE_MODE: ${{ github.event.inputs.mode || 'mcq' }}
          SCRAPE_URL: ${{ github.event.inputs.url }}
          SCRAPE_PROMPT: ${{ github.event.inputs.prompt }}
        run: python main.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Manual scraper run (${{ github.event.inputs.mode }} mode)" || echo "No changes detected to commit."
          git push
